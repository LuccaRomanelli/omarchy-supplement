# Hyprland configuration overrides
# Add your custom settings here

# Example overrides:
# $mainMod = SUPER
$terminal = uwsm app -- env GTK_IM_MODULE=none ghostty
$browser = zen-browser --force-device-scale-factor=0.8

# Use single default monitor (see all monitors with: hyprctl monitors)
# monitor=,preferred,auto,1.6

# --- Configuração de dois monitores---
# Main ultrawide (horizontal)
monitor = DP-2,2560x1080@60,0x0,1

# LG TV vertical on the right: 270° rotation (transform,3)
# Position x = 2560 so it starts right after the ultrawide
monitor = HDMI-A-1,1920x1080@60,2560x0,1.33333333334,transform,3

# TV
#monitor = HDMI-A-1,3840x2160@60,-3840x0,1.0
# Workspace 1 fixed on vertical monitor
workspace = 1, monitor:HDMI-A-1

# All other workspaces fixed on main ultrawide
workspace = 2, monitor:DP-2
workspace = 3, monitor:DP-2
workspace = 4, monitor:DP-2
workspace = 5, monitor:DP-2
workspace = 6, monitor:DP-2
workspace = 7, monitor:DP-2
workspace = 8, monitor:DP-2
workspace = 9, monitor:DP-2
workspace = 10, monitor:DP-2

# # --- Configuração de Monitores notebook ---
# # Comportamento baseado na tampa do notebook:
# # - Tampa aberta: usa a tela do notebook (eDP-1)
# # - Tampa fechada: usa o monitor HDMI externo
#
# # Monitor externo HDMI - desabilitado por padrão (tampa aberta = notebook)
# monitor = HDMI-A-1, disable
#
# # Tela do notebook - habilitada por padrão
# monitor = eDP-1, preferred, 0x0, 1
#
# # --- Workspaces ---
# workspace = 1, default:true
#
# # Lid switch: tampa fechada -> desabilita notebook, habilita HDMI
# bindl = , switch:on:Lid Switch, exec, hyprctl keyword monitor "eDP-1, disable" && hyprctl keyword monitor "HDMI-A-1, 2560x1080@60, 0x0, 1"
#
# # Lid switch: tampa aberta -> habilita notebook, desabilita HDMI
# bindl = , switch:off:Lid Switch, exec, hyprctl keyword monitor "HDMI-A-1, disable" && hyprctl keyword monitor "eDP-1, preferred, 0x0, 1"

# Disable screen saver / idle
exec-once = systemctl --user stop hypridle.service
exec-once = systemctl --user mask hypridle.service

misc {
    mouse_move_enables_dpms=true
    key_press_enables_dpms=true
}

input {
  # Use multiple keyboard layouts and switch between them with Alt + Space
  # kb_layout = us,dk
  # kb_options = compose:caps,grp:alt_space_toggle
  kb_options = compose:ralt,ctrl:nocaps


  # Change speed of keyboard repeat
  repeat_rate = 50
  repeat_delay = 220

  # Increase sensitity for mouse/trackpack (default: 0)
  sensitivity = 0.35

  touchpad {
    # Use natural (inverse) scrolling
    # natural_scroll = true

    # Use two-finger clicks for right-click instead of lower-right corner
    # clickfinger_behavior = true

    # Control the speed of your scrolling
    scroll_factor = 0.4
  }
}

unbind = SUPER SHIFT, A
bindd = SUPER SHIFT, A, ChatLLM, exec, omarchy-launch-or-focus-webapp ChatLLM "https://apps.abacus.ai/chatllm/"

unbind = SUPER SHIFT, C
bindd = SUPER SHIFT, C, GCalendar, exec, omarchy-launch-webapp "https://calendar.google.com/calendar"

unbind = SUPER SHIFT, W
bindd = SUPER SHIFT, W, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"

unbind = SUPER SHIFT, M
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus-webapp Music "https://music.youtube.com/"

unbind = SUPER ALT, S
bindd = SUPER ALT, S, Start, exec, bash ~/shell/start.sh

unbind = SUPER ALT, Y
bindd = SUPER ALT, Y, Yopki, exec, bash ~/shell/yopki.sh

unbind = SUPER ALT, T
bindd = SUPER ALT, T, Random Theme, exec, bash ~/shell/theme_swap_random.sh

unbind = SUPER ALT, P
bindd = SUPER ALT, P, Play/Pause, exec, playerctl play-pause

unbind = SUPER SHIFT, G
bindd = SUPER SHIFT, G, GitHub, exec, omarchy-launch-or-focus-webapp GitHub "https://github.com/"

# Captures
unbind = , PRINT
unbind = SHIFT, PRINT
unbind = ALT, PRINT
unbind = SUPER, PRINT

bindd = , Page_Down, Screenshot with editing, exec, omarchy-cmd-screenshot
bindd = SHIFT, Page_Down, Screenshot to clipboard, exec, omarchy-cmd-screenshot smart clipboard
bindd = ALT, Page_Down, Screenrecording, exec, omarchy-menu screenrecord
bindd = SUPER, Page_Down, Color picker, exec, pkill hyprpicker || hyprpicker -a

# Voxtype - Speech-to-text (push-to-talk: hold SUPER+D to record)
unbind = SUPER, D
bind = SUPER, D, exec, voxtype record start
bindr = SUPER, D, exec, voxtype record stop
